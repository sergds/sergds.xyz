# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Garage S3

on:
  push:
    branches: ["new"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build-deploy:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.160.0
    steps:
      - name: Prepare environment
        run: |
          apt update && apt install wget nodejs git -y
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_withdeploy_${HUGO_VERSION}_linux-amd64.deb \
          && dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "sergds.xyz/"
      - name: Deploy to Garage
        id: deployment
        env:
          AWS_ACCESS_KEY_ID: '${{ secrets.GARAGE_ACCESS_KEY_ID }}'
          AWS_SECRET_ACCESS_KEY: '${{ secrets.GARAGE_SECRET_ACCESS_KEY }}'
        run: |
          hugo deploy --target forge-ci
